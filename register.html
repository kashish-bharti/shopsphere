<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your ShopSphere account to track orders and save your wishlist." />
  <title>Create Account — ShopSphere</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body style="background: linear-gradient(180deg, var(--slate-100) 0%, var(--slate-50) 100%); min-height: 100vh; display: flex; flex-direction: column;">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-container" style="justify-content: center;">
      <a href="index.html" class="brand-logo" aria-label="ShopSphere Home">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
        <span>Shop<span>Sphere</span></span>
      </a>
    </div>
  </header>

  <!-- Main Register Card -->
  <main id="main-content" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.25rem;">
    <div style="background: #ffffff; border: 1px solid var(--slate-200); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); width: 100%; max-width: 480px; padding: 2.5rem 2rem;">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--slate-900); margin-bottom: 0.5rem;">Create an Account</h1>
        <p style="font-size: 0.875rem; color: var(--slate-500);">Join ShopSphere for simulated checkout and persistent orders.</p>
      </div>

      <!-- Registration Form -->
      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="e.g. Jordan Miller" required />
          <span class="form-error" id="name-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="jordan@example.com" required autocomplete="email" />
          <span class="form-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-role">Account Type</label>
          <select id="reg-role" class="form-select">
            <option value="customer" selected>Customer (Standard Storefront)</option>
            <option value="admin">Administrator (Full Store Management)</option>
          </select>
          <small class="form-help">Select Admin if you want immediate access to the Admin CRUD suite.</small>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="reg-password" class="form-input" placeholder="Min. 6 characters" required autocomplete="new-password" />
            <button type="button" class="password-toggle-btn toggle-pass" data-target="reg-password" aria-label="Toggle password visibility">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
          <span class="form-error" id="password-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="Repeat your password" required autocomplete="new-password" />
            <button type="button" class="password-toggle-btn toggle-pass" data-target="reg-confirm-password" aria-label="Toggle password visibility">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
          <span class="form-error" id="confirm-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 1.5rem;" id="register-submit-btn">
          Create Account &rarr;
        </button>
      </form>

      <!-- Footer Info -->
      <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--slate-100); text-align: center;">
        <p style="font-size: 0.875rem; color: var(--slate-600); margin-bottom: 0.75rem;">
          Already have an account? <a href="login.html" style="font-weight: 600;">Sign In</a>
        </p>
        <div style="font-size: 0.75rem; color: var(--slate-400); line-height: 1.4;">
          🔒 Educational prototype: demo authentication with LocalStorage.
        </div>
      </div>
    </div>
  </main>

  <!-- Script Logic -->
  <script type="module">
    import { initApp } from './js/app.js';
    import { registerUser, getCurrentUser } from './js/auth.js';
    import { isValidEmail, isValidPassword, setInputError, clearInputError } from './js/validation.js';
    import { showToast } from './js/ui.js';

    document.addEventListener('DOMContentLoaded', () => {
      initApp();

      if (getCurrentUser()) {
        window.location.href = 'dashboard.html';
        return;
      }

      // Password toggles
      document.querySelectorAll('.toggle-pass').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (input) {
            input.type = input.type === 'password' ? 'text' : 'password';
          }
        });
      });

      // Form validation & submission
      const form = document.getElementById('register-form');
      const nameInput = document.getElementById('reg-name');
      const emailInput = document.getElementById('reg-email');
      const passInput = document.getElementById('reg-password');
      const confirmInput = document.getElementById('reg-confirm-password');
      const roleSelect = document.getElementById('reg-role');

      const nameError = document.getElementById('name-error');
      const emailError = document.getElementById('email-error');
      const passError = document.getElementById('password-error');
      const confirmError = document.getElementById('confirm-error');

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        let hasError = false;
        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passInput.value;
        const confirmPass = confirmInput.value;
        const role = roleSelect.value;

        if (name.length < 2) {
          setInputError(nameInput, nameError, 'Full name must be at least 2 characters.');
          hasError = true;
        } else {
          clearInputError(nameInput, nameError);
        }

        if (!isValidEmail(email)) {
          setInputError(emailInput, emailError, 'Please enter a valid email address.');
          hasError = true;
        } else {
          clearInputError(emailInput, emailError);
        }

        if (!isValidPassword(password)) {
          setInputError(passInput, passError, 'Password must be at least 6 characters long.');
          hasError = true;
        } else {
          clearInputError(passInput, passError);
        }

        if (password !== confirmPass) {
          setInputError(confirmInput, confirmError, 'Passwords do not match.');
          hasError = true;
        } else {
          clearInputError(confirmInput, confirmError);
        }

        if (hasError) return;

        try {
          const user = registerUser({ name, email, password, role });
          showToast(`Account created successfully! Welcome, ${user.name}!`, 'success');
          setTimeout(() => {
            window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
          }, 400);
        } catch (err) {
          showToast(err.message, 'error');
          setInputError(emailInput, emailError, err.message);
        }
      });
    });
  </script>
</body>
</html>
